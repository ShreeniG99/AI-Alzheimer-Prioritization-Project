data:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts
  reports_dir: reports

  # Later-stage measurements (MRI, plasma, PET) are matched to the
  # participant's baseline diagnosis date: the closest measurement within
  # this many days is used; later scans are never used as baseline inputs.
  modality_window_days: 180


# ============================================================
# FEATURES
# ============================================================

features:

  # ----------------------------------------------------------
  # STAGE 1
  # Pre-MRI clinical prioritization model
  #
  # These variables are available before MRI acquisition.
  #
  # Verified in the downloaded ADNI files:
  #   PTGENDER -> sex
  #   PTEDUCAT -> education
  #   MMSCORE  -> MMSE
  #   TOTSCORE -> ADAS-11
  #   FAQTOTAL -> FAQ
  #
  # MoCA is intentionally excluded from the primary model
  # because it is 69.41% missing in the final 24-month cohort
  # and 96.9% missing among the positive cases.
  #
  # Age is derived from PTDOB (date of birth) and the baseline
  # diagnosis date, since ADNI PTDEMOG has no AGE column.
  # SES is excluded because it is not collected in ADNI PTDEMOG.
  #
  # ADNI missing codes (-1, -4) are converted to NaN.
  # ----------------------------------------------------------

  stage1:
    numeric:
      - age
      - education
      - mmse
      - adas
      - faq

    categorical:
      - sex


  # ----------------------------------------------------------
  # STAGE 2
  # Blood-based biomarker refinement.
  #
  # Participants who reach Stage 2 have plasma results
  # (ADNI UPenn Fujirebio/Quanterix table): p-tau217,
  # Abeta42/40 ratio, NfL and GFAP.
  # ----------------------------------------------------------

  stage2:
    numeric:
      - age
      - education
      - mmse
      - adas
      - faq
      - ptau217
      - ab42_ab40
      - nfl
      - gfap

    categorical:
      - sex


  # ----------------------------------------------------------
  # STAGE 3
  # Post-MRI re-ranking model
  #
  # Stage-1 clinical variables plus MRI-derived variables.
  # ADNI has no OASIS eTIV/nWBV/ASF columns; they are derived from the
  # FreeSurfer table (UCSFFSX7): eTIV = intracranial volume, nWBV =
  # whole-brain volume / ICV, ASF = 1755 / eTIV, plus hippocampal
  # volume / ICV (hippocampus_icv).
  # Plasma biomarkers are included when available (left-joined;
  # missingness is handled by imputation + missing indicators).
  #
  # NOTE:
  # eTIV/nWBV/ASF must be verified in the downloaded MRI
  # tables before Stage 3 is built/trained.
  # ----------------------------------------------------------

  stage3:
    numeric:
      - age
      - education
      - mmse
      - adas
      - faq
      - ptau217
      - ab42_ab40
      - nfl
      - gfap
      - eTIV
      - nWBV
      - ASF
      - hippocampus_icv

    categorical:
      - sex


  # ----------------------------------------------------------
  # STAGE 4
  # PET-based refinement for the narrowed-down candidates.
  #
  # Amyloid PET (Centiloid, summary SUVR) and tau PET
  # (meta-temporal SUVR), plus all earlier information.
  # ----------------------------------------------------------

  stage4:
    numeric:
      - age
      - education
      - mmse
      - adas
      - faq
      - ptau217
      - ab42_ab40
      - nfl
      - gfap
      - eTIV
      - nWBV
      - ASF
      - hippocampus_icv
      - amyloid_centiloid
      - amyloid_suvr
      - tau_suvr

    categorical:
      - sex


# ============================================================
# TARGET
# ============================================================

target:

  # Prospective outcome:
  #
  # Among participants who are non-demented at baseline
  # (CN or MCI) and have >=24 months of follow-up:
  #
  #   0 = no dementia within 24 months
  #   1 = dementia within 24 months
  #
  mode: progression_24m


# ============================================================
# PRIORITIZATION
# ============================================================

priority:

  # Fraction of the validation cohort assigned to the
  # highest-priority workflow band.
  high_capacity_fraction: 0.20

  # Fraction assigned to the medium-priority band.
  # The remaining participants are lower priority.
  medium_capacity_fraction: 0.30


# ============================================================
# TRAINING
# ============================================================

training:

  # 60% train
  # 20% validation
  # 20% test
  #
  # Splitting is performed at participant level.
  test_size: 0.20
  validation_size: 0.20

  random_state: 42

  # Add "was missing" indicator features during imputation.
  # Off: with very few missing values the indicator learns spurious
  # rules (in ADNI, missing ADAS/FAQ -> low risk), which would push
  # patients with incomplete records down the queue.
  missing_indicators: false

  # Evaluate how many positive cases are captured when
  # prioritizing the top 20% of participants by predicted risk.
  top_k_fraction: 0.20


# ============================================================
# MODEL SELECTION
# ============================================================

selection_weights:

  # Precision-recall performance is particularly relevant
  # because the positive outcome is relatively uncommon.
  pr_auc: 0.35

  # Measures how many eventual converters are captured
  # within the prioritized group.
  top_k_recall: 0.35

  # Probability calibration matters because the output is
  # intended to represent risk for prioritization.
  calibration: 0.15

  # Preference for models whose behavior can be explained
  # to clinicians/research users.
  interpretability: 0.15


# ============================================================
# API
# ============================================================

api:

  # Current deployment target is the pre-MRI model.
  model_stage: stage1