data:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts
  reports_dir: reports

  # Later-stage measurements (MRI, plasma, PET) are matched to the
  # participant's baseline diagnosis date: the closest measurement within
  # this many days is used; later scans are never used as baseline inputs.
  modality_window_days: 180


# ============================================================
# FEATURES
# ============================================================

features:

  # ----------------------------------------------------------
  # STAGE 1 - Cognitive screening (pre-MRI)
  #
  # Demographics, cognitive/functional tests and baseline
  # comorbidities (architecture slide: "test scores + co-morbidities"):
  #   age      derived from PTDOB and the baseline diagnosis date
  #   bmi/sbp  VITALS (units converted), gds = Geriatric Depression Scale
  #   hx_*     MEDHIST flags (1 = yes)
  # MoCA is excluded (69% missing; contextual only). CDR is never used.
  # ----------------------------------------------------------

  stage1:
    numeric:
      - age
      - education
      - mmse
      - adas
      - faq
      - bmi
      - sbp
      - gds
      - hx_cardiovascular
      - hx_endocrine
      - hx_psychiatric
      - hx_neurologic
      - hx_smoking

    categorical:
      - sex


  # ----------------------------------------------------------
  # STAGE 2 - Blood-based biomarkers
  #
  # Participants with any plasma biomarker within the baseline window:
  #   UPENN Fujirebio/Quanterix: ptau217, ab42_ab40, nfl, gfap
  #   Gothenburg p-tau181 (ptau181), Blennow NfL (nfl_legacy; older
  #   assay on a different scale, kept separate from nfl)
  #   apoe4 = number of APOE e4 alleles (APOERES)
  # ----------------------------------------------------------

  stage2:
    numeric:
      - age
      - education
      - mmse
      - adas
      - faq
      - bmi
      - sbp
      - gds
      - hx_cardiovascular
      - hx_endocrine
      - hx_psychiatric
      - hx_neurologic
      - hx_smoking
      - apoe4
      - ptau217
      - ab42_ab40
      - nfl
      - gfap
      - ptau181
      - nfl_legacy

    categorical:
      - sex


  # ----------------------------------------------------------
  # STAGE 3 - MRI evaluation
  #
  # eTIV / nWBV / ASF / hippocampus_icv derived from FreeSurfer 7
  # (UCSFFSX7). Blood biomarkers are used when available.
  # ----------------------------------------------------------

  stage3:
    numeric:
      - age
      - education
      - mmse
      - adas
      - faq
      - bmi
      - sbp
      - gds
      - hx_cardiovascular
      - hx_endocrine
      - hx_psychiatric
      - hx_neurologic
      - hx_smoking
      - apoe4
      - ptau217
      - ab42_ab40
      - nfl
      - gfap
      - ptau181
      - nfl_legacy
      - eTIV
      - nWBV
      - ASF
      - hippocampus_icv

    categorical:
      - sex


  # ----------------------------------------------------------
  # STAGE 4 - PET imaging
  #
  #   amyloid_centiloid  UC Berkeley amyloid PET (harmonised across
  #                      florbetapir / florbetaben / NAV4694 tracers)
  #   fdg                UC Berkeley FDG-PET MetaROI (glucose metabolism)
  # Tau PET is not used: only 5 converters had a tau scan near baseline.
  # Tracer-specific amyloid SUVR is not used (not comparable across tracers).
  # ----------------------------------------------------------

  stage4:
    numeric:
      - age
      - education
      - mmse
      - adas
      - faq
      - bmi
      - sbp
      - gds
      - hx_cardiovascular
      - hx_endocrine
      - hx_psychiatric
      - hx_neurologic
      - hx_smoking
      - apoe4
      - ptau217
      - ab42_ab40
      - nfl
      - gfap
      - ptau181
      - nfl_legacy
      - eTIV
      - nWBV
      - ASF
      - hippocampus_icv
      - amyloid_centiloid
      - fdg

    categorical:
      - sex


# ============================================================
# TARGET
# ============================================================

target:

  # Prospective outcome:
  #
  # Among participants who are non-demented at baseline
  # (CN or MCI) and have >=24 months of follow-up:
  #
  #   0 = no dementia within 24 months
  #   1 = dementia within 24 months
  #
  mode: progression_24m


# ============================================================
# PRIORITIZATION
# ============================================================

priority:

  # Fraction of the validation cohort assigned to the
  # highest-priority workflow band.
  high_capacity_fraction: 0.20

  # Fraction assigned to the medium-priority band.
  # The remaining participants are lower priority.
  medium_capacity_fraction: 0.30


# ============================================================
# TRAINING
# ============================================================

training:

  # 60% train
  # 20% validation
  # 20% test
  #
  # Splitting is performed at participant level.
  test_size: 0.20
  validation_size: 0.20

  random_state: 42

  # Add "was missing" indicator features during imputation.
  # Off: with very few missing values the indicator learns spurious
  # rules (in ADNI, missing ADAS/FAQ -> low risk), which would push
  # patients with incomplete records down the queue.
  missing_indicators: false

  # Evaluate how many positive cases are captured when
  # prioritizing the top 20% of participants by predicted risk.
  top_k_fraction: 0.20


# ============================================================
# MODEL SELECTION
# ============================================================

selection_weights:

  # Precision-recall performance is particularly relevant
  # because the positive outcome is relatively uncommon.
  pr_auc: 0.35

  # Measures how many eventual converters are captured
  # within the prioritized group.
  top_k_recall: 0.35

  # Probability calibration matters because the output is
  # intended to represent risk for prioritization.
  calibration: 0.15

  # Preference for models whose behavior can be explained
  # to clinicians/research users.
  interpretability: 0.15


# ============================================================
# API
# ============================================================

api:

  # Current deployment target is the pre-MRI model.
  model_stage: stage1

# ============================================================
# TEMPO - PROGRESSION RATE ("how fast will this person decline?")
# ============================================================

tempo:

  # Target: annual change in CDR Sum of Boxes (CDR-SB), the slope of a
  # straight line through each participant's CDR-SB visits from baseline
  # to 36 months (visits up to 39 months allowed for scheduling).
  # Cohort: the same CN/MCI baseline participants as the pathway models,
  # with a CDR-SB visit at baseline (within 3 months), >= 3 visits and
  # >= 12 months between the first and last visit.
  window_months: 36
  window_tolerance_months: 3
  baseline_tolerance_months: 3
  min_visits: 3
  min_span_months: 12

  # Decline-speed tiers on the predicted slope (CDR-SB points per year).
  # In ADNI CN/MCI: ~70% < 0.3, ~19% 0.3-1.0, ~11% >= 1.0.
  speed_thresholds:
    moderate: 0.3
    fast: 1.0

  # Coverage of the prediction interval (split-conformal on cross-
  # validated residuals).
  interval_coverage: 0.80

  # Fraction of the ranked cohort used for "fast-decliner capture".
  top_fraction: 0.20

  selection_weights:
    spearman: 0.40
    fast_capture: 0.40
    interpretability: 0.20
