services:
  postgres:
    image: postgres:16-alpine
    container_name: alzheimer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alzheimer
      POSTGRES_USER: alzheimer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alzheimer -d alzheimer"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alzheimer-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://alzheimer:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/alzheimer
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Trained models, reports and the processed cohort (used for bootstrap
      # uncertainty) contain ADNI-derived data: mounted read-only, never baked
      # into the image.
      - ./artifacts:/app/artifacts:ro
      - ./reports:/app/reports:ro
      - ./data/processed:/app/data/processed:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alzheimer-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
