<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 880" width="1620" height="880" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#000"/></marker></defs>
<rect width="1620" height="880" fill="#fff"/>
<text x="40" y="40" font-size="18" font-weight="700" font-style="normal" text-anchor="start" fill="#000">Fig. Methodology of IDEA</text>
<rect x="115.0" y="70" width="160" height="45" rx="22.5" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="195" y="97.5" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" fill="#000">Start</text>
<rect x="60.0" y="150" width="270" height="70" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="195" y="172.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Load ADNI tables: cognition,</text>
<text x="195" y="190.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">blood, MRI, PET, diagnoses,</text>
<text x="195" y="208.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">CDR-SB visits</text>
<rect x="60.0" y="255" width="270" height="90" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="195" y="278.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Preprocess: missing codes</text>
<text x="195" y="296.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">(-1, -4, -5) → missing; age from</text>
<text x="195" y="314.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">DOB; FreeSurfer ratios; measure</text>
<text x="195" y="332.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">closest to baseline (±180 d)</text>
<rect x="60.0" y="380" width="270" height="70" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="195" y="402.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Build targets: dementia within</text>
<text x="195" y="420.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">24 months; CDR-SB change per</text>
<text x="195" y="438.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">year. CDR not used as input</text>
<rect x="60.0" y="485" width="270" height="60" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="195" y="511.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Split by participant:</text>
<text x="195" y="529.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">60% train / 20% val / 20% test</text>
<path d="M195 115 L195 148" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M195 220 L195 253" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M195 345 L195 378" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M195 450 L195 483" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M330 515 L420 515 L420 120 L488 120" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="490.0" y="90" width="300" height="60" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="640" y="116.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Take next pathway stage</text>
<text x="640" y="134.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">(1 screening, 2 blood, 3 MRI, 4 PET)</text>
<polygon points="640,180.0 770.0,230 640,280.0 510.0,230" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="640" y="226" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Enough converters</text>
<text x="640" y="244" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">to train?</text>
<rect x="490.0" y="310" width="300" height="60" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="640" y="336.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Train risk models (LR, RF, XGBoost)</text>
<text x="640" y="354.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">and TEMPO models (ridge, RF, XGBoost)</text>
<rect x="490.0" y="400" width="300" height="60" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="640" y="426.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Pick best model per target</text>
<text x="640" y="444.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">on the validation set</text>
<rect x="490.0" y="490" width="300" height="60" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="640" y="516.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Refit; Platt calibration (risk),</text>
<text x="640" y="534.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">conformal 80% interval (TEMPO)</text>
<rect x="490.0" y="580" width="300" height="60" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="640" y="606.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Evaluate once on test set:</text>
<text x="640" y="624.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">ROC-AUC, PR-AUC, ECE, top-20% recall</text>
<polygon points="640,670.0 770.0,720 640,770.0 510.0,720" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="640" y="716" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">All four stages</text>
<text x="640" y="734" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">done?</text>
<circle cx="640" cy="830" r="18" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="640" y="835" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" fill="#000">A</text>
<path d="M640 150 L640 178" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M640 280 L640 308" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M640 370 L640 398" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M640 460 L640 488" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M640 550 L640 578" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M640 640 L640 668" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M640 770 L640 810" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<text x="648" y="298" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000">Yes</text>
<text x="648" y="795" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000">Yes</text>
<path d="M510 230 L470 230 L470 720 L508 720" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<text x="504" y="222" font-size="13" font-weight="700" font-style="normal" text-anchor="end" fill="#000">No</text>
<path d="M770 720 L830 720 L830 120 L792 120" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<text x="776" y="712" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000">No</text>
<circle cx="1200" cy="75" r="18" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="1200" y="80" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" fill="#000">A</text>
<text x="1230" y="80" font-size="12" font-weight="400" font-style="italic" text-anchor="start" fill="#000">deployed models</text>
<rect x="1050.0" y="125" width="300" height="60" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="1200" y="151.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Clinician enters Stage 1</text>
<text x="1200" y="169.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">screening data for a patient</text>
<rect x="1050.0" y="220" width="300" height="100" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="1200" y="257.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Predict risk and priority tier,</text>
<text x="1200" y="275.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">decline rate with interval,</text>
<text x="1200" y="293.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">SHAP reasons; re-rank the queue</text>
<polygon points="1200,360.0 1330.0,410 1200,460.0 1070.0,410" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="1200" y="406" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Priority</text>
<text x="1200" y="424" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">LOW?</text>
<polygon points="1200,495.0 1330.0,545 1200,595.0 1070.0,545" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="1200" y="541" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Stage 4 (PET)</text>
<text x="1200" y="559" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">reached?</text>
<rect x="1050.0" y="625" width="300" height="55" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="1200" y="657.5" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Specialist review</text>
<rect x="1120.0" y="730" width="160" height="45" rx="22.5" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="1200" y="757.5" font-size="15" font-weight="700" font-style="normal" text-anchor="middle" fill="#000">End</text>
<path d="M1200 93 L1200 123" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M1200 185 L1200 218" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M1200 320 L1200 358" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M1200 460 L1200 493" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1208" y="482" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000">No</text>
<path d="M1200 595 L1200 623" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1208" y="614" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000">Yes</text>
<path d="M1200 680 L1200 728" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="865.0" y="375" width="170" height="70" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="950" y="397.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Routine follow-up;</text>
<text x="950" y="415.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">visit window sized</text>
<text x="950" y="433.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">by decline rate</text>
<path d="M1070 410 L1037 410" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1064" y="402" font-size="13" font-weight="700" font-style="normal" text-anchor="end" fill="#000">Yes</text>
<path d="M950 445 L950 752 L1118 752" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="1360.0" y="510" width="180" height="70" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="1450" y="532.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">Order next test</text>
<text x="1450" y="550.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">(blood → MRI → PET)</text>
<text x="1450" y="568.0" font-size="14" font-weight="400" font-style="normal" text-anchor="middle" fill="#000">and enter results</text>
<path d="M1330 545 L1358 545" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1336" y="537" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000">No</text>
<path d="M1540 545 L1575 545 L1575 270 L1352 270" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
</svg>